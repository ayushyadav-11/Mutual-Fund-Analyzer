<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - MF Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-container { max-width: 400px; margin: 80px auto; background: var(--bg-card); padding: 30px; border-radius: 12px; box-shadow: var(--shadow-sm); }
    .auth-container h2 { text-align: center; margin-bottom: 20px; }
    .auth-form { display: flex; flex-direction: column; gap: 15px; }
    .auth-form input { padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-main); color: var(--text-main); }
    .auth-form button { padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="auth-container">
    <h2>Set New Password</h2>
    <form id="reset-form" class="auth-form">
      <input type="password" id="new-password" placeholder="Enter new password" required minlength="6" />
      <button type="submit" id="reset-btn">Update Password</button>
    </form>
    <div style="text-align: center; margin-top: 15px;">
        <a href="/" style="color: var(--text-muted); font-size: 0.9em; text-decoration: none;">&larr; Back to Login</a>
    </div>
  </div>

  <script>
    const API = 'https://mutual-fund-analyzer-z48c.onrender.com';
    const getApiUrl = () => window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? window.location.origin : API;
    
    let supabase = null;
    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    (async function initSupabase() {
        try {
            const res = await fetch(getApiUrl() + '/api/config');
            const config = await res.json();
            if(config.SUPABASE_URL && config.SUPABASE_ANON_KEY) {
                supabase = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
            } else {
                showToast('❌ Supabase config missing. Please set up the backend.');
            }
        } catch (e) {
            console.error("Failed to initialize Supabase:", e);
        }
    })();

    document.getElementById('reset-form').onsubmit = async (e) => {
        e.preventDefault();
        
        // Ensure supabase is loaded
        if (!supabase) return showToast('❌ Auth configuration not loaded yet.');

        const newPassword = document.getElementById('new-password').value;
        const btn = document.getElementById('reset-btn');
        btn.disabled = true;
        btn.textContent = 'Updating...';

        try {
            // Because Supabase includes the hash fragment #refresh_token=... in the URL 
            // when redirecting from email, the JS SDK automatically captures it!
            const { data, error } = await supabase.auth.updateUser({
              password: newPassword
            });

            if (error) throw error;

            showToast('✅ Password updated successfully! Redirecting...');
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);

        } catch (err) {
            showToast('❌ ' + err.message);
            btn.disabled = false;
            btn.textContent = 'Update Password';
        }
    };
  </script>
</body>
</html>
